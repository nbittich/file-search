# Builds the image on master (tag: latest) and on a release tag (tag: the version).
#
# Each architecture is built on its own native runner (no QEMU emulation: compiling rust for arm64 under emulation
# took most of the build time), pushed by digest, then a single job tags the multi-arch manifest. Per-architecture
# tags (:amd64 / :arm64) are no longer pushed: they were shared by master and releases, so a release could publish
# the image of another build.
name: docker

on:
  push:
    branches:
      - "master"
    tags:
      - "*"

# release.sh pushes master and the tag of the same commit: the second run waits for the first one and then only hits
# the cache, instead of building everything twice in parallel
concurrency:
  group: docker-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: nbittich/file-search

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          # same cache refs as before, the existing cache is reused
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # master: latest, tag: the tag only (a release doesn't move latest, master does)
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag

      - name: Create and push the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        # one -t per tag: the metadata output has one tag per line, which broke the previous inline command
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
