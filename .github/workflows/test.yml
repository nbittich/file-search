# Tests on every push and pull request (the docker workflow builds without running them).
name: test

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # the extraction tools the tests may use (pdftotext, tesseract)
      - name: Install poppler and tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Test
        run: cargo test
