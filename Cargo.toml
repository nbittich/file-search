[package]
name = "file-search"
version = "0.1.11"
edition = "2024"
license = "MPL-2.0"
authors = ["Nordine Bittich"]
description = "File indexing and search"
repository = "https://github.com/nbittich/file-search"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.9", features = [ "tracing"] }
axum-extra = "0.12.6"
calamine = { version = "0.37.0", features = ["chrono", "dates"] }
chrono = "0.4.31"
csv = "1.3.0"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
tantivy = "0.27.0"
tokio = { version = "1.34.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = [
  "env-filter",
  "time",
  "local-time",
] }
uuid = { version = "1.6.1", features = ["v4"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace", "redirect"] }
time = { version = "0.3.30", features = [
  "formatting",
  "local-offset",
  "macros",
] }
pdf-extract = { git = "https://github.com/jrmuizel/pdf-extract.git", rev = "379647e" }

sha2 = "0.11"
hex = "0.4"
walkdir = "2"
zip = "9"
tar = "0.4"
flate2 = "1"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.3.1"
# CI backends to support
ci = ["github"]
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu"]
# Publish jobs to run in CI
pr-run-mode = "skip"
