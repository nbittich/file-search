[package]
name = "file-search"
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
authors = ["Nordine Bittich"]
description = "File indexing and search (pdf with OCR, spreadsheets, csv, documents, images, text)"
repository = "https://github.com/nbittich/file-search"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.9", features = ["tracing"] }
calamine = { version = "0.38.0", features = ["chrono", "dates"] }
chrono = "0.4.45"
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tantivy = "0.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "time",
  "local-time",
] }
uuid = { version = "1.29.2", features = ["v4"] }
tower-http = { version = "0.7.1", features = ["trace"] }
time = { version = "0.3.55", features = [
  "formatting",
  "local-offset",
  "macros",
] }
pdf-extract = "0.12.1"

sha2 = "0.11.1"
hex = "0.4.3"
walkdir = "2.5.0"
zip = "9.5.0"
tar = "0.4.46"
flate2 = "1.1.10"
